<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finansal Pano</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --income: #16a34a;
      --expense: #dc2626;
      --remaining: #2563eb;
      --sidebar-w: 210px;
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #topbar { height: 52px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0; }
    #topbar h1 { font-size: 16px; font-weight: 700; flex: 1; }
    #main { display: flex; flex: 1; overflow: hidden; }
    #sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; padding: 8px 0; }
    #content { flex: 1; overflow-y: auto; padding: 20px; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }
    #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; align-items: center; justify-content: center; }
    #modal-overlay.open { display: flex; }
    #modal { background: var(--surface); border-radius: 10px; width: 480px; max-height: 80vh; overflow-y: auto; padding: 24px; }
    #settings-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 300; align-items: center; justify-content: center; }
    #settings-overlay.open { display: flex; }
    #settings-modal { background: var(--surface); border-radius: 10px; width: 640px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; }
    .settings-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .settings-modal-header h2 { font-size: 15px; font-weight: 700; }
    .settings-modal-body { display: flex; flex: 1; overflow: hidden; }
    .settings-nav { width: 160px; border-right: 1px solid var(--border); padding: 8px 0; flex-shrink: 0; overflow-y: auto; }
    .settings-nav-item { width: 100%; text-align: left; padding: 9px 16px; font-size: 13px; font-weight: 500; color: var(--text); border-radius: 0; }
    .settings-nav-item:hover { background: var(--bg); }
    .settings-nav-item.active { background: #eff6ff; color: var(--remaining); font-weight: 600; }
    .settings-content { flex: 1; overflow-y: auto; padding: 24px; }
    .btn-secondary { background: #f1f5f9; border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 13px; }
    .year-group { }
    .year-btn { width: 100%; text-align: left; padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
    .year-btn:hover { background: var(--bg); }
    .year-months { padding: 0 0 4px 0; }
    .month-btn { width: 100%; text-align: left; padding: 6px 14px 6px 28px; font-size: 13px; color: var(--text); border-radius: 0; transition: background .1s; }
    .month-btn:hover { background: #f1f5f9; }
    .month-btn.active { background: #eff6ff; color: var(--remaining); font-weight: 600; }
    #summary-strip { display: flex; gap: 12px; margin-bottom: 20px; }
    .stat-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
    .stat-card .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .stat-card .value { font-size: 22px; font-weight: 700; }
    .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
    .section-header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; cursor: pointer; user-select: none; }
    .section-header .section-title { font-size: 14px; font-weight: 700; flex: 1; }
    .section-header .section-total { font-size: 14px; font-weight: 600; }
    .section-body { border-top: 1px solid var(--border); }
    .item-row { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-top: 1px solid var(--border); font-size: 13px; transition: background .1s; }
    .item-row:hover { background: #f8fafc; }
    .drag-handle { color: #cbd5e1; cursor: grab; font-size: 16px; flex-shrink: 0; user-select: none; }
    .type-badge { border-radius: 99px; padding: 2px 8px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
    .item-name { flex: 1; font-size: 13px; }
    .item-amount { font-weight: 600; font-size: 13px; flex-shrink: 0; width: 100px; text-align: right; }
    .item-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .item-actions button { padding: 3px 7px; border-radius: 4px; font-size: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); }
    .item-actions button:hover { background: var(--bg); }
    .item-note { font-size: 11px; color: var(--text-muted); padding: 0 16px 8px 52px; border-top: none; }
    .item-edit-row { padding: 10px 16px; border-top: 1px solid var(--border); background: #f8fafc; display: flex; flex-direction: column; gap: 8px; }
    .item-edit-row .edit-fields { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .item-edit-row input, .item-edit-row select, .item-edit-row textarea { font-family: inherit; font-size: 13px; border: 1px solid var(--border); border-radius: 5px; padding: 5px 8px; background: #fff; }
    .item-edit-row input { width: 160px; }
    .item-edit-row input[type=number] { width: 110px; }
    .item-edit-row select { width: 140px; }
    .item-edit-row textarea { width: 100%; height: 48px; resize: none; }
    .edit-error { color: var(--expense); font-size: 12px; }
    .edit-actions { display: flex; gap: 8px; }
    .btn-save { background: #2563eb; color: #fff; border-radius: 5px; padding: 5px 14px; font-size: 13px; }
    .btn-cancel { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 5px 14px; font-size: 13px; }
    .modal-tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .modal-tab { padding: 6px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); }
    .modal-tab.active { background: #eff6ff; color: var(--remaining); border-color: #bfdbfe; }
    .type-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .type-row input[type=text] { flex: 1; font-family: inherit; font-size: 13px; border: 1px solid var(--border); border-radius: 5px; padding: 4px 8px; }
    .type-row input[type=color] { width: 32px; height: 28px; border: 1px solid var(--border); border-radius: 5px; padding: 1px; cursor: pointer; }
    .type-add-row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
    .type-add-row input[type=text] { flex:1; font-family: inherit; font-size:13px; border:1px solid var(--border); border-radius:5px; padding:5px 8px; }
    .type-add-row input[type=color] { width:32px; height:32px; border:1px solid var(--border); border-radius:5px; padding:1px; cursor:pointer; }
    .btn-add-type { background: #2563eb; color: #fff; border-radius: 5px; padding: 5px 14px; font-size: 13px; }
    .type-del-btn { color: var(--expense); font-size: 13px; border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; }
    .type-warn { color: var(--expense); font-size: 11px; margin-top: 2px; }
    .modal-close { float: right; font-size: 18px; color: var(--text-muted); background: none; border: none; cursor: pointer; }
    #btn-menu { display: none; }

    /* ── Mobile (≤ 640px) ──────────────────────────────────────── */
    @media (max-width: 640px) {
      #btn-menu { display: flex; }

      #topbar .btn-label { display: none; }

      #sidebar {
        position: fixed;
        top: 52px;
        left: calc(-1 * var(--sidebar-w));
        height: calc(100vh - 52px);
        z-index: 200;
        transition: left .25s ease;
        box-shadow: 2px 0 12px rgba(0,0,0,.15);
      }
      body.drawer-open #sidebar { left: 0; }
      body.drawer-open { overflow: hidden; }

      #drawer-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 199;
        background: rgba(0,0,0,.35);
      }
      body.drawer-open #drawer-backdrop { display: block; }

      #modal {
        width: 100%;
        max-width: 100%;
        height: 100vh;
        height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
      }

      #settings-modal {
        width: 100%;
        max-width: 100%;
        height: 100vh;
        height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
        flex-direction: column;
      }
      .settings-modal-body { flex-direction: column; overflow: visible; }
      .settings-nav { width: 100%; border-right: none; border-bottom: 1px solid var(--border); display: flex; flex-direction: row; padding: 0; overflow-x: auto; }
      .settings-nav-item { white-space: nowrap; padding: 10px 16px; border-bottom: 2px solid transparent; }
      .settings-nav-item.active { background: transparent; border-bottom-color: var(--remaining); }
      .settings-content { overflow-y: auto; flex: 1; }

      #summary-strip { flex-direction: column; }

      .item-edit-row input,
      .item-edit-row input[type=number],
      .item-edit-row select { width: 100%; }

      .pie-chart-wrap { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="topbar">
    <button id="btn-menu" aria-label="Menüyü aç" style="font-size:20px;padding:4px 8px;">☰</button>
    <h1>💰 Finansal Pano</h1>
    <button id="btn-export" class="btn-secondary">⬇ <span class="btn-label">Dışa Aktar</span></button>
    <button id="btn-import" class="btn-secondary">⬆ <span class="btn-label">İçe Aktar</span></button>
    <input type="file" id="import-file-input" accept=".json" style="display:none">
    <button id="btn-sync-pull" class="btn-secondary">☁ <span class="btn-label">Uzaktan Al</span></button>
    <button id="btn-sync-push" class="btn-secondary">☁ <span class="btn-label">Uzağa Gönder</span></button>
    <button id="btn-clear" class="btn-secondary" style="color:var(--expense)">🗑 <span class="btn-label">Temizle</span></button>
    <button id="btn-settings" class="btn-secondary">⚙ <span class="btn-label">Ayarlar</span></button>
  </div>
  <div id="drawer-backdrop"></div>
  <div id="main">
    <nav id="sidebar"></nav>
    <main id="content"></main>
  </div>
  <!-- Settings Modal -->
  <div id="settings-overlay">
    <div id="settings-modal">
      <div class="settings-modal-header">
        <h2>⚙ Ayarlar</h2>
        <button class="modal-close" onclick="closeSettings()">✕</button>
      </div>
      <div class="settings-modal-body">
        <nav class="settings-nav">
          <button class="settings-nav-item active" onclick="setSettingsSection('types')">Tipler</button>
          <button class="settings-nav-item" onclick="setSettingsSection('remote')">Remote DB</button>
        </nav>
        <div class="settings-content" id="settings-content"></div>
      </div>
    </div>
  </div>
  <!-- Types Modal -->
  <div id="modal-overlay">
    <div id="modal"></div>
  </div>
  <script>
    // ── Constants ──────────────────────────────────────────────
    const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

    const DEFAULT_INCOME_TYPES = [
      { id: 'it1', name: 'Düzenli Maaş', color: '#2563eb' },
      { id: 'it2', name: 'Yan Gelir',    color: '#7c3aed' },
      { id: 'it3', name: 'Kira Geliri',  color: '#059669' },
      { id: 'it4', name: 'Yatırım',      color: '#d97706' },
      { id: 'it5', name: 'Diğer',        color: '#64748b' },
    ];

    const DEFAULT_EXPENSE_TYPES = [
      { id: 'et1', name: 'Konut',        color: '#dc2626' },
      { id: 'et2', name: 'Market & Gıda',color: '#ea580c' },
      { id: 'et3', name: 'Faturalar',    color: '#ca8a04' },
      { id: 'et4', name: 'Ulaşım',       color: '#0891b2' },
      { id: 'et5', name: 'Sağlık',       color: '#db2777' },
      { id: 'et6', name: 'Eğitim',       color: '#4f46e5' },
      { id: 'et7', name: 'Eğlence',      color: '#7c3aed' },
      { id: 'et8', name: 'Diğer',        color: '#64748b' },
    ];

    // ── State ──────────────────────────────────────────────────
    const STORAGE_KEY = 'financial-board-v1';
    let state = null; // loaded in init()
    let activeMonth = null; // "YYYY-MM"
    let activeYearView = null; // number — when set, show year overview instead of month
    let openYears = new Set(); // tracks which year groups are expanded
    let openSections = new Set(['incomes', 'expenses']); // both open by default
    let editingState = null; // { kind: 'income'|'expense', idx: number } | null
    let modalTab = 'income'; // 'income' | 'expense'
    let typeEditingId = null;
    let settingsSection = 'types'; // 'types' | 'remote'

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {
        showStorageWarning();
      }
      return null;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        showStorageWarning();
      }
    }

    function initState() {
      const saved = loadState();
      state = saved || {
        incomeTypes: DEFAULT_INCOME_TYPES.map(t => ({ ...t })),
        expenseTypes: DEFAULT_EXPENSE_TYPES.map(t => ({ ...t })),
        months: {},
      };
    }

    function ensureMonth(key) {
      if (!state.months[key]) {
        state.months[key] = { incomes: [], expenses: [] };
        saveState();
      }
    }

    function uuid() {
      return crypto.randomUUID();
    }

    function showStorageWarning() {
      let banner = document.getElementById('storage-warning');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'storage-warning';
        banner.style = 'background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:8px 16px;font-size:13px;text-align:center;';
        banner.textContent = '⚠️ localStorage kullanılamıyor — veriler kaydedilmeyecek.';
        document.body.prepend(banner);
      }
    }

    // ── Render: Sidebar ────────────────────────────────────────
    function renderSidebar() {
      const sidebar = document.getElementById('sidebar');
      const currentYear = new Date().getFullYear();
      const maxYear = currentYear + 5;
      let html = '';
      for (let y = maxYear; y >= 2020; y--) {
        const isPast = y < currentYear;
        if (isPast) {
          const hasData = Object.keys(state.months).some(k => k.startsWith(`${y}-`));
          if (!hasData) continue;
        }
        const isOpen = openYears.has(y);
        const isYearActive = activeYearView === y;
        html += `<div class="year-group">
          <button class="year-btn" onclick="toggleYear(${y})" id="year-btn-${y}">
            <span style="display:flex;align-items:center;gap:6px;">${y}<span onclick="event.stopPropagation();selectYearView(${y})" title="${y} yılı özeti" style="font-size:11px;padding:1px 5px;border-radius:4px;border:1px solid ${isYearActive ? 'var(--remaining)' : 'var(--border)'};color:${isYearActive ? 'var(--remaining)' : 'var(--text-muted)'};background:${isYearActive ? '#eff6ff' : 'transparent'};cursor:pointer;">📊</span></span><span id="year-arrow-${y}">${isOpen ? '▾' : '▸'}</span>
          </button>
          <div class="year-months" id="year-months-${y}" style="display:${isOpen ? 'block' : 'none'}">`;
        for (let m = 0; m < 12; m++) {
          const key = `${y}-${String(m + 1).padStart(2, '0')}`;
          const isActive = key === activeMonth;
          const data = state.months[key];
          const hasDot = data && (data.incomes.length || data.expenses.length);
          html += `<button class="month-btn${isActive ? ' active' : ''}" onclick="selectMonth('${key}')" style="display:flex;align-items:center;justify-content:space-between;">
            <span>${MONTHS[m]}</span>${hasDot ? '<span style="width:6px;height:6px;border-radius:50%;background:var(--remaining);flex-shrink:0;"></span>' : ''}
          </button>`;
        }
        html += `</div></div>`;
      }
      sidebar.innerHTML = html;
    }

    function toggleYear(y) {
      const months = document.getElementById(`year-months-${y}`);
      const arrow = document.getElementById(`year-arrow-${y}`);
      const open = months.style.display !== 'none';
      months.style.display = open ? 'none' : 'block';
      arrow.textContent = open ? '▸' : '▾';
      if (open) openYears.delete(y); else openYears.add(y);
    }

    function selectMonth(key) {
      closeDrawer();
      activeMonth = key;
      activeYearView = null;
      ensureMonth(key);
      renderSidebar();
      renderContent();
    }

    function selectYearView(y) {
      closeDrawer();
      activeYearView = y;
      activeMonth = null;
      renderSidebar();
      renderContent();
    }

    function renderContent() {
      const content = document.getElementById('content');
      if (activeYearView) { renderYearView(activeYearView); return; }
      if (!activeMonth) { content.innerHTML = ''; return; }
      const [y, m] = activeMonth.split('-');
      const monthData = state.months[activeMonth] || { incomes: [], expenses: [] };
      const totalIncome = monthData.incomes.reduce((s, i) => s + (i.amount || 0), 0);
      const totalExpense = monthData.expenses.reduce((s, i) => s + (i.amount || 0), 0);
      const remaining = totalIncome - totalExpense;
      const remainColor = remaining >= 0 ? 'var(--remaining)' : 'var(--expense)';
      const monthLabel = `${MONTHS[parseInt(m, 10) - 1]} ${y}`;
      const isEmpty = !monthData.incomes.length && !monthData.expenses.length;
      const sourceMonths = Object.keys(state.months)
        .filter(k => k !== activeMonth && (state.months[k].incomes.length || state.months[k].expenses.length))
        .sort((a, b) => b.localeCompare(a));
      const cloneUI = isEmpty && sourceMonths.length ? `
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:13px;color:var(--text-muted)">Klonla:</span>
          <select id="clone-select" style="font-family:inherit;font-size:13px;border:1px solid var(--border);border-radius:5px;padding:4px 8px;background:#fff;color:var(--text);">
            <option value="">— ay seç —</option>
            ${sourceMonths.map(k => {
              const [ky, km] = k.split('-');
              return `<option value="${k}">${MONTHS[parseInt(km,10)-1]} ${ky}</option>`;
            }).join('')}
          </select>
          <button onclick="cloneMonth()" style="font-size:13px;background:#2563eb;color:#fff;border-radius:5px;padding:4px 12px;">Klonla</button>
        </div>` : '';

      content.innerHTML = `
        <h2 style="font-size:18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;">${monthLabel}${cloneUI}</h2>
        <div id="summary-strip">
          <div class="stat-card">
            <div class="label">Toplam Gelir</div>
            <div class="value" style="color:var(--income)">${fmt(totalIncome)}</div>
          </div>
          <div class="stat-card">
            <div class="label">Toplam Gider</div>
            <div class="value" style="color:var(--expense)">${fmt(totalExpense)}</div>
          </div>
          <div class="stat-card">
            <div class="label">Kalan</div>
            <div class="value" style="color:${remainColor}">${fmt(remaining)}</div>
          </div>
        </div>
        <div class="section-card">
          <div class="section-header" onclick="toggleSection('incomes')">
            <span class="section-arrow">${openSections.has('incomes') ? '▾' : '▸'}</span>
            <span class="section-title" style="color:var(--income)">GELİRLER</span>
            <span class="section-total" style="color:var(--income)">${fmt(totalIncome)}</span>
          </div>
          <div class="section-body" id="section-incomes" style="display:${openSections.has('incomes') ? 'block' : 'none'}">
            ${renderItemList(monthData.incomes, 'income', editingState && editingState.kind === 'income' ? editingState.idx : -1)}
            <div style="padding:10px 16px;">
              <button onclick="addItem('income')" style="font-size:13px;color:var(--income);border:1px dashed var(--income);border-radius:6px;padding:6px 12px;">+ Yeni Gelir Ekle</button>
            </div>
          </div>
        </div>
        <div class="section-card">
          <div class="section-header" onclick="toggleSection('expenses')">
            <span class="section-arrow">${openSections.has('expenses') ? '▾' : '▸'}</span>
            <span class="section-title" style="color:var(--expense)">GİDERLER</span>
            <span class="section-total" style="color:var(--expense)">${fmt(totalExpense)}</span>
          </div>
          <div class="section-body" id="section-expenses" style="display:${openSections.has('expenses') ? 'block' : 'none'}">
            ${renderItemList(monthData.expenses, 'expense', editingState && editingState.kind === 'expense' ? editingState.idx : -1)}
            <div style="padding:10px 16px;">
              <button onclick="addItem('expense')" style="font-size:13px;color:var(--expense);border:1px dashed var(--expense);border-radius:6px;padding:6px 12px;">+ Yeni Gider Ekle</button>
            </div>
          </div>
        </div>
        <div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;">
          ${renderPieChart(monthData.incomes, state.incomeTypes, 'Gelir Dağılımı', 'var(--income)')}
          ${renderPieChart(monthData.expenses, state.expenseTypes, 'Gider Dağılımı', 'var(--expense)')}
        </div>
      `;
    }

    function renderPieChart(items, types, title, accentColor) {
      const groups = {};
      for (const item of items) {
        if (!item.amount) continue;
        const type = types.find(t => t.id === item.typeId);
        const label = type ? type.name : '—';
        const color = type ? safeColor(type.color) : '#64748b';
        const key = item.typeId || '__none__';
        if (!groups[key]) groups[key] = { label, color, total: 0 };
        groups[key].total += item.amount;
      }
      const slices = Object.values(groups).filter(g => g.total > 0);
      const grand = slices.reduce((s, g) => s + g.total, 0);

      if (!slices.length) return `
        <div class="section-card" style="flex:1;min-width:200px;padding:16px;">
          <div style="font-size:12px;font-weight:600;color:${accentColor};text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;">${title}</div>
          <p style="font-size:13px;color:var(--text-muted);">Veri yok.</p>
        </div>`;

      const cx = 80, cy = 80, r = 64;
      let angle = -Math.PI / 2;
      const paths = slices.map(g => {
        const slice = (g.total / grand) * 2 * Math.PI;
        const x1 = cx + r * Math.cos(angle);
        const y1 = cy + r * Math.sin(angle);
        angle += slice;
        const x2 = cx + r * Math.cos(angle);
        const y2 = cy + r * Math.sin(angle);
        const large = slice > Math.PI ? 1 : 0;
        return `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large},1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${g.color}" stroke="#fff" stroke-width="2"/>`;
      }).join('');

      const legend = slices.map(g => {
        const pct = ((g.total / grand) * 100).toFixed(1);
        return `<div style="display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:5px;">
          <span style="width:10px;height:10px;border-radius:2px;background:${g.color};flex-shrink:0;"></span>
          <span style="flex:1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${escHtml(g.label)}">${escHtml(g.label)}</span>
          <span style="color:var(--text-muted);white-space:nowrap;">${pct}%</span>
          <span style="color:var(--text);font-weight:600;white-space:nowrap;">${fmt(g.total)}</span>
        </div>`;
      }).join('');

      return `
        <div class="section-card" style="flex:1;min-width:260px;padding:16px;">
          <div style="font-size:12px;font-weight:600;color:${accentColor};text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;">${title}</div>
          <div style="display:flex;gap:16px;align-items:center;">
            <svg width="160" height="160" viewBox="0 0 160 160" style="flex-shrink:0;">${paths}</svg>
            <div style="flex:1;min-width:0;">${legend}</div>
          </div>
        </div>`;
    }

    function renderYearView(y) {
      const content = document.getElementById('content');
      const months = [];
      for (let m = 1; m <= 12; m++) {
        const key = `${y}-${String(m).padStart(2, '0')}`;
        const data = state.months[key];
        if (!data || (!data.incomes.length && !data.expenses.length)) continue;
        const income  = data.incomes.reduce((s, i) => s + (i.amount || 0), 0);
        const expense = data.expenses.reduce((s, i) => s + (i.amount || 0), 0);
        months.push({ key, label: MONTHS[m - 1], income, expense, remaining: income - expense });
      }

      const totIncome  = months.reduce((s, r) => s + r.income, 0);
      const totExpense = months.reduce((s, r) => s + r.expense, 0);
      const totRemain  = totIncome - totExpense;

      const rows = months.length ? months.map(r => {
        const rc = r.remaining >= 0 ? 'var(--remaining)' : 'var(--expense)';
        return `<tr onclick="selectMonth('${r.key}')" style="cursor:pointer;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background=''">
          <td style="padding:10px 16px;font-weight:500;">${r.label}</td>
          <td style="padding:10px 16px;text-align:right;color:var(--income)">${fmt(r.income)}</td>
          <td style="padding:10px 16px;text-align:right;color:var(--expense)">${fmt(r.expense)}</td>
          <td style="padding:10px 16px;text-align:right;font-weight:700;color:${rc}">${fmt(r.remaining)}</td>
        </tr>`;
      }).join('') : `<tr><td colspan="4" style="padding:20px 16px;color:var(--text-muted);text-align:center;">${y} yılına ait veri yok.</td></tr>`;

      const rc = totRemain >= 0 ? 'var(--remaining)' : 'var(--expense)';
      content.innerHTML = `
        <h2 style="font-size:18px;margin-bottom:16px;">${y} Yılı Özeti</h2>
        <div class="section-card">
          <table style="width:100%;border-collapse:collapse;">
            <thead>
              <tr style="border-bottom:2px solid var(--border);">
                <th style="padding:10px 16px;text-align:left;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;">Ay</th>
                <th style="padding:10px 16px;text-align:right;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;">Gelir</th>
                <th style="padding:10px 16px;text-align:right;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;">Gider</th>
                <th style="padding:10px 16px;text-align:right;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;">Kalan</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
            ${months.length ? `<tfoot>
              <tr style="border-top:2px solid var(--border);background:#f8fafc;">
                <td style="padding:10px 16px;font-weight:700;">Toplam</td>
                <td style="padding:10px 16px;text-align:right;font-weight:700;color:var(--income)">${fmt(totIncome)}</td>
                <td style="padding:10px 16px;text-align:right;font-weight:700;color:var(--expense)">${fmt(totExpense)}</td>
                <td style="padding:10px 16px;text-align:right;font-weight:700;color:${rc}">${fmt(totRemain)}</td>
              </tr>
            </tfoot>` : ''}
          </table>
        </div>`;
    }

    function fmt(n) {
      return '₺' + Number(n).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function toggleSection(id) {
      const body = document.getElementById(`section-${id}`);
      const header = body.previousElementSibling;
      const arrow = header.querySelector('.section-arrow');
      const open = body.style.display !== 'none';
      body.style.display = open ? 'none' : 'block';
      arrow.textContent = open ? '▸' : '▾';
      if (open) openSections.delete(id); else openSections.add(id);
    }

    function renderItemList(items, kind, editingIdx = -1) {
      if (!items.length && editingIdx === -1) {
        return `<p style="padding:12px 16px;color:var(--text-muted);font-size:13px;">Henüz kalem yok.</p>`;
      }
      const types = kind === 'income' ? state.incomeTypes : state.expenseTypes;
      const amtColor = kind === 'income' ? 'var(--income)' : 'var(--expense)';
      return items.map((item, idx) => {
        if (idx === editingIdx) return renderEditRow(item, kind, idx, types);
        const type = types.find(t => t.id === item.typeId);
        const badgeColor = type ? safeColor(type.color) : '#64748b';
        const badgeBg = badgeColor + '20';
        const badgeName = type ? type.name : '—';
        const noteHtml = item.note ? `<div class="item-note">${escHtml(item.note)}</div>` : '';
        return `
          <div class="item-row" draggable="true" data-kind="${kind}" data-idx="${idx}"
               ondragstart="onDragStart(event)" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)" ondragend="onDragEnd(event)">
            <span class="drag-handle">⠿</span>
            <span class="type-badge" style="color:${badgeColor};background:${badgeBg}">${escHtml(badgeName)}</span>
            <span class="item-name">${escHtml(item.name)}</span>
            <span class="item-amount" style="color:${amtColor}">${fmt(item.amount)}</span>
            <div class="item-actions">
              <button onclick="editItem('${kind}', ${idx})">✏</button>
              <button onclick="deleteItem('${kind}', ${idx})" style="color:var(--expense)">🗑</button>
            </div>
          </div>${noteHtml}`;
      }).join('');
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function onTypeChange(select) {
      const typeId = select.value;
      const types = editingState && editingState.kind === 'income' ? state.incomeTypes : state.expenseTypes;
      const type = types.find(t => t.id === typeId);
      const nameInput = document.getElementById('ef-name');
      if (type && nameInput) nameInput.value = type.name;
    }

    function safeColor(c) {
      return /^#[0-9a-fA-F]{6}$/.test(String(c)) ? c : '#64748b';
    }

    function renderEditRow(item, kind, idx, types) {
      const opts = types.map(t => `<option value="${t.id}"${t.id === item.typeId ? ' selected' : ''}>${escHtml(t.name)}</option>`).join('');
      const periodField = item._isNew ? `
            <label style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-muted);">
              <span>Periyot</span>
              <input id="ef-period" type="number" min="1" max="60" value="1" style="width:60px;" title="Kaç aya eklensin?" />
              <span>ay</span>
            </label>` : '';
      return `
        <div class="item-edit-row" id="edit-row-${kind}-${idx}">
          <div class="edit-fields">
            <input id="ef-name" type="text" value="${escHtml(item.name)}" placeholder="Ad" onkeydown="if(event.key==='Enter')saveItem('${kind}',${idx})" />
            <input id="ef-amount" type="number" min="0" step="0.01" value="${item.amount}" placeholder="Tutar" onkeydown="if(event.key==='Enter')saveItem('${kind}',${idx})" />
            <select id="ef-type" onchange="onTypeChange(this)">${opts}</select>
            ${periodField}
          </div>
          <textarea id="ef-note" placeholder="Açıklama (opsiyonel)">${escHtml(item.note || '')}</textarea>
          <div class="edit-actions">
            <button class="btn-save" onclick="saveItem('${kind}', ${idx})">Kaydet</button>
            <button class="btn-cancel" onclick="cancelEdit('${kind}', ${idx})">İptal</button>
            <span class="edit-error" id="ef-error"></span>
          </div>
        </div>`;
    }

    function cloneMonth() {
      const srcKey = document.getElementById('clone-select').value;
      if (!srcKey) return;
      const src = state.months[srcKey];
      if (!src) return;
      state.months[activeMonth] = {
        incomes: src.incomes.map(i => ({ ...i, id: uuid(), _isNew: false })),
        expenses: src.expenses.map(i => ({ ...i, id: uuid(), _isNew: false })),
      };
      saveState();
      renderContent();
    }

    function addItem(kind) {
      if (editingState) {
        cancelEdit(editingState.kind, editingState.idx);
      }
      const types = kind === 'income' ? state.incomeTypes : state.expenseTypes;
      const defaultType = types[0] || null;
      const items = state.months[activeMonth][kind === 'income' ? 'incomes' : 'expenses'];
      items.push({
        id: uuid(),
        name: defaultType ? defaultType.name : (kind === 'income' ? 'Yeni Gelir' : 'Yeni Gider'),
        amount: 0,
        typeId: defaultType ? defaultType.id : null,
        note: '',
        _isNew: true,
      });
      editItem(kind, items.length - 1);
    }

    function deleteItem(kind, idx) {
      const key = kind === 'income' ? 'incomes' : 'expenses';
      state.months[activeMonth][key].splice(idx, 1);
      saveState();
      renderContent();
    }

    function editItem(kind, idx) {
      editingState = { kind, idx };
      renderContent();
      const row = document.getElementById(`edit-row-${kind}-${idx}`);
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      const nameInput = document.getElementById('ef-name');
      if (nameInput) nameInput.focus();
    }

    function saveItem(kind, idx) {
      const name = document.getElementById('ef-name').value.trim();
      const amountRaw = document.getElementById('ef-amount').value;
      const amount = parseFloat(amountRaw);
      const typeId = document.getElementById('ef-type').value;
      const note = document.getElementById('ef-note').value.trim();
      const periodEl = document.getElementById('ef-period');
      const period = periodEl ? Math.max(1, parseInt(periodEl.value, 10) || 1) : 1;
      const errEl = document.getElementById('ef-error');

      if (!name) { errEl.textContent = 'Ad boş bırakılamaz.'; return; }
      if (isNaN(amount) || amount < 0) { errEl.textContent = 'Geçerli bir tutar girin (≥ 0).'; return; }

      const key = kind === 'income' ? 'incomes' : 'expenses';
      const baseItem = { ...state.months[activeMonth][key][idx], name, amount, typeId, note, _isNew: false };
      state.months[activeMonth][key][idx] = baseItem;

      // Add to subsequent months if period > 1
      if (period > 1) {
        const [y, m] = activeMonth.split('-').map(Number);
        for (let i = 1; i < period; i++) {
          const totalMonths = (m - 1) + i;
          const ny = y + Math.floor(totalMonths / 12);
          const nm = (totalMonths % 12) + 1;
          const nextKey = `${ny}-${String(nm).padStart(2, '0')}`;
          ensureMonth(nextKey);
          state.months[nextKey][key].push({ ...baseItem, id: uuid() });
        }
      }

      saveState();
      editingState = null;
      renderSidebar();
      renderContent();
    }

    function cancelEdit(kind, idx) {
      const key = kind === 'income' ? 'incomes' : 'expenses';
      const item = state.months[activeMonth][key][idx];
      if (item._isNew) {
        state.months[activeMonth][key].splice(idx, 1);
        saveState();
      }
      editingState = null;
      renderContent();
    }

    // Drag & Drop
    let dragSrcKind = null;
    let dragSrcIdx = null;

    function onDragStart(e) {
      dragSrcKind = e.currentTarget.dataset.kind;
      dragSrcIdx = parseInt(e.currentTarget.dataset.idx, 10);
      e.currentTarget.style.opacity = '0.4';
      e.dataTransfer.effectAllowed = 'move';
    }

    function onDragOver(e) {
      e.preventDefault();
      const target = e.currentTarget;
      if (target.dataset.kind !== dragSrcKind) {
        e.dataTransfer.dropEffect = 'none';
        return;
      }
      e.dataTransfer.dropEffect = 'move';
      target.style.borderTop = '2px solid var(--remaining)';
    }

    function onDrop(e) {
      e.preventDefault();
      const target = e.currentTarget;
      target.style.borderTop = '';
      if (dragSrcKind === null) return;
      if (target.dataset.kind !== dragSrcKind) return;
      const destIdx = parseInt(target.dataset.idx, 10);
      const srcKind = dragSrcKind;
      const srcIdx = dragSrcIdx;
      dragSrcKind = null;
      dragSrcIdx = null;
      if (destIdx === srcIdx) return;
      const key = srcKind === 'income' ? 'incomes' : 'expenses';
      const items = state.months[activeMonth][key];
      const [moved] = items.splice(srcIdx, 1);
      items.splice(destIdx, 0, moved);
      saveState();
      renderContent();
    }

    function onDragEnd(e) {
      e.currentTarget.style.opacity = '';
      e.currentTarget.style.borderTop = '';
      dragSrcKind = null;
      dragSrcIdx = null;
    }

    function onDragLeave(e) {
      e.currentTarget.style.borderTop = '';
    }

    // ── Modal ──────────────────────────────────────────────────
    function openTypesModal() {
      document.getElementById('modal-overlay').classList.add('open');
      renderModal();
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('open');
      typeEditingId = null;
    }

    function renderModal(containerId) {
      const types = modalTab === 'income' ? state.incomeTypes : state.expenseTypes;
      const modal = document.getElementById(containerId || 'modal');
      modal.innerHTML = `
        <button class="modal-close" onclick="closeModal()">✕</button>
        <h3 style="font-size:16px;margin-bottom:14px;">Tip Yönetimi</h3>
        <div class="modal-tabs">
          <button class="modal-tab${modalTab === 'income' ? ' active' : ''}" onclick="setModalTab('income')">Gelir Tipleri</button>
          <button class="modal-tab${modalTab === 'expense' ? ' active' : ''}" onclick="setModalTab('expense')">Gider Tipleri</button>
        </div>
        <div id="type-list">
          ${types.map(t => `
            <div class="type-row" id="tr-${t.id}">
              ${typeEditingId === t.id
                ? `<input type="color" id="ec-${t.id}" value="${t.color}" />
                   <input type="text" id="en-${t.id}" value="${escHtml(t.name)}" />
                   <button class="btn-save" style="font-size:12px;padding:3px 10px;" onclick="saveType('${t.id}')">Kaydet</button>
                   <button class="btn-cancel" style="font-size:12px;padding:3px 10px;" onclick="cancelTypeEdit()">İptal</button>
                   <span class="type-warn" id="tw-${t.id}"></span>`
                : `<span style="width:18px;height:18px;border-radius:50%;background:${safeColor(t.color)};display:inline-block;flex-shrink:0"></span>
                   <span style="flex:1">${escHtml(t.name)}</span>
                   <button style="font-size:12px;border:1px solid var(--border);border-radius:4px;padding:2px 7px;" onclick="startTypeEdit('${t.id}')">✏</button>
                   <button class="type-del-btn" onclick="deleteType('${t.id}')">🗑</button>
                   <span class="type-warn" id="tw-${t.id}"></span>`
              }
            </div>`).join('')}
        </div>
        <div class="type-add-row">
          <input type="color" id="new-type-color" value="#64748b" />
          <input type="text" id="new-type-name" placeholder="Yeni tip adı..." />
          <button class="btn-add-type" onclick="addType()">+ Ekle</button>
        </div>
        <span class="type-warn" id="add-type-error"></span>
      `;
    }

    function activeContainer() {
      return (settingsSection === 'types' && document.getElementById('settings-overlay').classList.contains('open'))
        ? 'settings-content' : 'modal';
    }

    function setModalTab(tab) { modalTab = tab; typeEditingId = null; renderModal(activeContainer()); }
    function startTypeEdit(id) { typeEditingId = id; renderModal(activeContainer()); }
    function cancelTypeEdit() { typeEditingId = null; renderModal(activeContainer()); }

    function addType() {
      const name = document.getElementById('new-type-name').value.trim();
      const color = document.getElementById('new-type-color').value;
      const errEl = document.getElementById('add-type-error');
      if (!name) { errEl.textContent = 'Tip adı boş olamaz.'; return; }
      const types = modalTab === 'income' ? state.incomeTypes : state.expenseTypes;
      if (types.find(t => t.name.toLowerCase() === name.toLowerCase())) {
        errEl.textContent = 'Bu isimde bir tip zaten var.'; return;
      }
      types.push({ id: uuid(), name, color });
      saveState();
      renderModal(activeContainer());
      renderContent();
    }

    function saveType(id) {
      const name = document.getElementById(`en-${id}`).value.trim();
      const color = document.getElementById(`ec-${id}`).value;
      const types = modalTab === 'income' ? state.incomeTypes : state.expenseTypes;
      const errEl = document.getElementById(`tw-${id}`);
      if (!name) {
        if (errEl) errEl.textContent = 'Ad boş olamaz.';
        return;
      }
      const duplicate = types.find(t => t.id !== id && t.name.toLowerCase() === name.toLowerCase());
      if (duplicate) {
        if (errEl) errEl.textContent = 'Bu isimde bir tip zaten var.';
        return;
      }
      const type = types.find(t => t.id === id);
      if (type) { type.name = name; type.color = color; }
      saveState();
      typeEditingId = null;
      renderModal(activeContainer());
      renderContent();
    }

    function deleteType(id) {
      const types = modalTab === 'income' ? state.incomeTypes : state.expenseTypes;
      const allItems = Object.values(state.months).flatMap(m =>
        modalTab === 'income' ? m.incomes : m.expenses
      );
      const inUse = allItems.filter(i => i.typeId === id).length;
      const errEl = document.getElementById(`tw-${id}`);
      if (inUse > 0) {
        if (errEl) errEl.textContent = `${inUse} kalem bu tipi kullanıyor. Önce kalemleri güncelleyin.`;
        return;
      }
      const idx = types.findIndex(t => t.id === id);
      if (idx !== -1) types.splice(idx, 1);
      saveState();
      renderModal(activeContainer());
      renderContent();
    }

    // ── Init ───────────────────────────────────────────────────
    function init() {
      document.getElementById('modal-overlay').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
      });
      document.getElementById('settings-overlay').addEventListener('click', function(e) {
        if (e.target === this) closeSettings();
      });
      document.getElementById('btn-settings').addEventListener('click', openSettings);
      document.getElementById('btn-export').addEventListener('click', exportData);
      document.getElementById('btn-import').addEventListener('click', () => document.getElementById('import-file-input').click());
      document.getElementById('import-file-input').addEventListener('change', importData);
      document.getElementById('btn-menu').addEventListener('click', toggleDrawer);
      document.getElementById('drawer-backdrop').addEventListener('click', closeDrawer);
      document.getElementById('btn-sync-pull').addEventListener('click', syncFromRemote);
      document.getElementById('btn-sync-push').addEventListener('click', syncToRemote);
      document.getElementById('btn-clear').addEventListener('click', clearStorage);

      try {
        initState();
        const now = new Date();
        activeMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        openYears.add(now.getFullYear());
        ensureMonth(activeMonth);
        renderSidebar();
        renderContent();
      } catch (e) {
        console.error('Init error:', e);
        document.getElementById('content').innerHTML =
          `<div style="padding:32px;color:var(--expense)">
            <strong>Veri yüklenemedi.</strong> localStorage bozulmuş olabilir.
            <br><br>
            <button onclick="clearStorage()" style="background:var(--expense);color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:14px;">
              🗑 Veriyi Temizle ve Başa Dön
            </button>
          </div>`;
      }
    }

    function toggleDrawer() {
      const open = document.body.classList.toggle('drawer-open');
      const btn = document.getElementById('btn-menu');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.setAttribute('aria-label', open ? 'Menüyü kapat' : 'Menüyü aç');
    }

    function closeDrawer() {
      document.body.classList.remove('drawer-open');
      const btn = document.getElementById('btn-menu');
      btn.setAttribute('aria-expanded', 'false');
      btn.setAttribute('aria-label', 'Menüyü aç');
    }

    const SETTINGS_KEY = 'financial-board-settings';

    function loadRemoteSettings() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch { return null; }
    }

    async function syncFromRemote() {
      const cfg = loadRemoteSettings();
      if (!cfg || !cfg.binId || !cfg.accessKey) {
        alert('Lütfen Ayarlar > Remote DB bölümünden bağlantı bilgilerini girin.');
        return;
      }
      const btn = document.getElementById('btn-sync-pull');
      btn.disabled = true;
      btn.textContent = '⏳';
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${cfg.binId}`, {
          headers: { 'X-Access-Key': cfg.accessKey }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        state = data.record;
        saveState();
        renderSidebar();
        renderContent();
      } catch (err) {
        alert('Uzaktan alma başarısız: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '☁ <span class="btn-label">Uzaktan Al</span>';
      }
    }

    async function syncToRemote() {
      const cfg = loadRemoteSettings();
      if (!cfg || !cfg.binId || !cfg.accessKey) {
        alert('Lütfen Ayarlar > Remote DB bölümünden bağlantı bilgilerini girin.');
        return;
      }
      const btn = document.getElementById('btn-sync-push');
      btn.disabled = true;
      btn.textContent = '⏳';
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${cfg.binId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Access-Key': cfg.accessKey
          },
          body: JSON.stringify(state)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
      } catch (err) {
        alert('Uzağa gönderme başarısız: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '☁ <span class="btn-label">Uzağa Gönder</span>';
      }
    }

    function openSettings() {
      settingsSection = 'types';
      document.getElementById('settings-overlay').classList.add('open');
      renderSettingsContent();
    }

    function closeSettings() {
      document.getElementById('settings-overlay').classList.remove('open');
    }

    function setSettingsSection(section) {
      settingsSection = section;
      document.querySelectorAll('.settings-nav-item').forEach(el => {
        el.classList.toggle('active', el.getAttribute('onclick') === `setSettingsSection('${section}')`);
      });
      renderSettingsContent();
    }

    function renderSettingsContent() {
      if (settingsSection === 'types') {
        renderModal('settings-content');
      } else {
        const cfg = loadRemoteSettings() || {};
        const el = document.getElementById('settings-content');
        el.innerHTML = `
          <h3 style="font-size:14px;font-weight:700;margin-bottom:16px;">Remote DB Ayarları</h3>
          <div style="display:flex;flex-direction:column;gap:12px;max-width:400px;">
            <label style="font-size:13px;font-weight:600;">Bin ID
              <input id="settings-bin-id" type="text" value="${escHtml(cfg.binId || '')}"
                style="display:block;width:100%;margin-top:4px;font-family:inherit;font-size:13px;border:1px solid var(--border);border-radius:5px;padding:6px 10px;">
            </label>
            <label style="font-size:13px;font-weight:600;">X-Access-Key
              <div style="display:flex;gap:6px;margin-top:4px;">
                <input id="settings-access-key" type="password" value="${escHtml(cfg.accessKey || '')}"
                  style="flex:1;font-family:monospace;font-size:12px;border:1px solid var(--border);border-radius:5px;padding:6px 10px;">
                <button onclick="toggleKeyVisibility()" style="border:1px solid var(--border);border-radius:5px;padding:6px 10px;background:var(--surface);font-size:14px;" title="Göster/Gizle">👁</button>
              </div>
            </label>
            <div style="display:flex;align-items:center;gap:12px;">
              <button class="btn-save" onclick="saveRemoteSettings()">Kaydet</button>
              <span id="settings-save-msg" style="font-size:12px;color:var(--income);"></span>
            </div>
          </div>`;
      }
    }

    function toggleKeyVisibility() {
      const inp = document.getElementById('settings-access-key');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function saveRemoteSettings() {
      const binId = document.getElementById('settings-bin-id').value.trim();
      const accessKey = document.getElementById('settings-access-key').value.trim();
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ binId, accessKey }));
      const msg = document.getElementById('settings-save-msg');
      msg.textContent = 'Kaydedildi ✓';
      setTimeout(() => { msg.textContent = ''; }, 1500);
    }

    function clearStorage() {
      if (!confirm('Tüm veriler silinecek. Emin misiniz?')) return;
      localStorage.removeItem('financial-board-v1');
      state = initState();
      saveState();
      renderSidebar();
      renderContent();
    }

    function exportData() {
      const json = JSON.stringify(state, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'finansal-pano.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed.incomeTypes || !parsed.expenseTypes || !parsed.months) {
            alert('Geçersiz dosya formatı. Lütfen doğru bir finansal pano JSON dosyası seçin.');
            return;
          }
          state = parsed;
          saveState();
          renderSidebar();
          renderContent();
        } catch {
          alert('Dosya okunamadı. Geçerli bir JSON dosyası seçin.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
